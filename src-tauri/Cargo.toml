[package]
name = "universal-creative-software-hub"
version = "0.1.0"
description = "Curated launcher and store for free creative software"
authors = ["giovaceciliato"]
edition = "2021"
license = "MIT"

[lib]
name = "ucsh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
