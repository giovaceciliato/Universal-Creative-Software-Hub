[package]
name = "universal-creative-software-hub"
version = "0.1.0"
description = "Curated launcher and store for free creative software"
authors = ["giovaceciliato"]
edition = "2021"
license = "MIT"

[lib]
name = "ucsh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

tempfile = "3"
ed25519-dalek = "2"
base64 = "0.22"
toml = "0.8"
