name: Release desktop v0.1.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'docs/releases/v0.1.0.md'

permissions:
  contents: read
concurrency:
  group: release-v0.1.0
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-release-version.mjs
        env:
          RELEASE_TAG: v0.1.0
  frontend:
    needs: version
    uses: ./.github/workflows/frontend-check.yml
  packages:
    needs: version
    uses: ./.github/workflows/native-build.yml
  publish:
    needs: [frontend, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: packages
          merge-multiple: true
      - name: Verify complete asset set and write checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          find packages -type f \( -name '*.rpm' -o -name '*.exe' -o -name '*.dmg' \) -exec cp {} release-assets/ \;
          test "$(find release-assets -name '*.rpm' | wc -l)" -eq 1
          test "$(find release-assets -name '*.exe' | wc -l)" -eq 1
          test "$(find release-assets -name '*.dmg' | wc -l)" -eq 1
          cd release-assets
          sha256sum -- * > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish only after upload and download verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" = "$RELEASE_SHA"
          # Never replace an existing release or move an existing tag.
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'Release already exists. Inspect it before retrying; nothing was overwritten.'
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/v0.1.0" >/dev/null 2>&1; then
            echo 'Tag already exists. Inspect it before retrying; nothing was overwritten.'
            exit 1
          fi
          cp docs/releases/v0.1.0.md release-notes.md
          printf '\nBuild commit: `%s`\n\n[Validation run](https://github.com/%s/actions/runs/%s)\n' "$RELEASE_SHA" "$GH_REPO" "$GITHUB_RUN_ID" >> release-notes.md
          gh release create v0.1.0 --draft --target "$RELEASE_SHA" --title 'Universal Creative Software Hub v0.1.0 — first alpha' --notes-file release-notes.md
          gh release upload v0.1.0 release-assets/*
          gh release download v0.1.0 --dir downloaded
          (cd downloaded && sha256sum --check SHA256SUMS.txt)
          diff release-assets/SHA256SUMS.txt downloaded/SHA256SUMS.txt
          test "$(find downloaded -type f | wc -l)" -eq 4
          # Check main again immediately before making downloads public.
          test "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" = "$RELEASE_SHA"
          gh release edit v0.1.0 --draft=false --latest
