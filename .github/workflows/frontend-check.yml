name: Frontend and catalog checks

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Validate catalog
        run: npm run validate:catalog
      - name: Validate request moderation and duplicate protection
        run: node scripts/test-community-requests.mjs
      - name: Test approval workflow retries
        run: node --test scripts/test-create-approved-app-pr.mjs
      - name: Check TypeScript and bundle
        run: npm run build
      - name: Install browser for download flow tests
        run: npx playwright install --with-deps chromium
      - name: Test approved downloads and installation confirmation
        run: npm run test:downloads

