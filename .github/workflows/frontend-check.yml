name: Frontend and catalog checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Validate catalog
        run: npm run validate:catalog
      - name: Check TypeScript and bundle
        run: npm run build
